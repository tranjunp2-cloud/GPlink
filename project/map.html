<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPLink — partner pharmacies</title>
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://server.arcgisonline.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
<style>
html,body,#map{height:100%;margin:0;background:#f2efe9;font-family:Archivo,system-ui,sans-serif}
.leaflet-container{background:#f2efe9;font-family:Archivo,system-ui,sans-serif}
.gp-pw{width:100%;height:100%;filter:drop-shadow(0 2px 3px rgba(15,23,42,.35));transition:transform .15s;transform-origin:50% 120%}
.gp-pw:hover{transform:scale(1.08)}
.gp-pin{box-sizing:border-box;width:100%;height:100%;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#fff;border:2px solid #00308F;display:flex;align-items:center;justify-content:center}
.gp-pin b{transform:rotate(45deg);font:700 13px/1 Archivo,system-ui,sans-serif;color:#00308F}
.gp-pin.cur{background:#00308F;border-color:#fff}
.gp-pin.cur b{color:#fff}
.gp-pin.on b{font-size:15px}
.gp-you{width:16px;height:16px;border-radius:50%;background:#1A73E8;border:3px solid #fff;box-shadow:0 0 0 8px rgba(26,115,232,.2),0 1px 3px rgba(0,0,0,.3)}
.leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.22)}
.leaflet-popup-content{margin:16px 18px;font-size:13.5px;line-height:1.45;color:#3c4043}
.pp{display:flex;flex-direction:column;gap:7px}
.pp .nm{font-size:16px;color:#202124;margin:0 18px 2px 0}
.pp .row{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.pp .row svg{flex:none;margin-top:2px;color:#70757a}
.pp .row .g{flex:1 1 0;min-width:0}
.pp .open{padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#dcfce7;color:#15803d}
.pp .open.off{background:#fee2e2;color:#b91c1c}
.pp .row b{color:#00308F}
.pp .acts{display:flex;gap:2px;margin:2px 0 0 -8px}
.pp .acts a{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 8px;border-radius:999px;color:#00308F;font-weight:600;text-decoration:none}
.pp .acts a:hover{background:#eef3fc}
.leaflet-container a.leaflet-popup-close-button{top:8px;right:8px;color:#70757a}
.leaflet-touch .leaflet-bar,.leaflet-bar{border:0;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.leaflet-touch .leaflet-bar a,.leaflet-bar a{width:40px;height:40px;line-height:40px;font:400 24px/40px Arial,sans-serif;color:#666;border-bottom:1px solid #e6e6e6}
.leaflet-bar a:last-child{border-bottom:0}
.leaflet-bar a:hover{background:#f5f5f5;color:#333}
.leaflet-bottom.leaflet-right .leaflet-control{margin-right:12px}
.leaflet-bottom .leaflet-control{margin-bottom:12px}
.leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.75)!important;margin:0!important}
.gp-btn{width:40px;height:40px;border:0;border-radius:8px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;color:#666;cursor:pointer;padding:0}
.gp-btn:hover{color:#333;background:#f5f5f5}
.gp-btn:focus-visible,.gp-layer:focus-visible,.leaflet-bar a:focus-visible{outline:2px solid #00308F;outline-offset:2px}
.gp-layer{position:relative;width:72px;height:72px;padding:0;border:2px solid #fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer;background:#ddd center/cover no-repeat}
.gp-layer span{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font:600 11px/1 Archivo,system-ui,sans-serif;text-align:left}
.leaflet-bottom.leaflet-left .leaflet-control{margin-left:12px}
#hint{position:absolute;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.45);color:#fff;font:400 20px/1.3 Archivo,system-ui,sans-serif;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s}
</style>
</head>
<body>
<div id="map" role="img" aria-label="Map of partner pharmacies in Kuala Lumpur"></div>
<div id="hint" aria-hidden="true"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script>
const GEO = {p1:[3.1312, 101.6714], p2:[3.1178, 101.6773], p3:[3.1292, 101.6862], p4:[3.1181, 101.6224], p5:[3.0466, 101.5855], p6:[3.1110, 101.6655], p7:[3.1520, 101.6625], p8:[3.1466, 101.7083], p9:[3.1579, 101.7119], p10:[3.0805, 101.7378], p11:[3.2160, 101.6360], p12:[3.0733, 101.4899]};
const KL = [3.1260, 101.6650];
const LANG = new URLSearchParams(location.search).get('lang') === 'bm' ? 'bm' : 'en';
const MAC = /Mac|iPhone|iPad/.test(navigator.platform);
const TX = {
  en:{sat:'Satellite', map:'Map', recenter:'Recenter map', zin:'Zoom in', zout:'Zoom out', hint:MAC ? 'Use ⌘ + scroll to zoom the map' : 'Use Ctrl + scroll to zoom the map'},
  bm:{sat:'Satelit', map:'Peta', recenter:'Pusatkan semula peta', zin:'Zum masuk', zout:'Zum keluar', hint:MAC ? 'Gunakan ⌘ + tatal untuk zum peta' : 'Gunakan Ctrl + tatal untuk zum peta'}
}[LANG];
const sv = d => `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC = {
  pin:sv('<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>'),
  clock:sv('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>'),
  bike:sv('<circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/>'),
  nav:sv('<polygon points="3 11 22 2 13 21 11 13 3 11"/>'),
  msg:sv('<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>')
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]));
const post = m => { try { parent.postMessage(m, '*'); } catch (e) {} };

// Ctrl/⌘ + scroll zooms; plain scroll shows a hint and lets the page scroll
const hint = document.getElementById('hint'); hint.textContent = TX.hint; let hintT = null;
const wheel = L.Map.ScrollWheelZoom.prototype._onWheelScroll;
L.Map.ScrollWheelZoom.prototype._onWheelScroll = function (e) {
  if (e.ctrlKey || e.metaKey) { hint.style.opacity = 0; return wheel.call(this, e); }
  hint.style.opacity = 1; clearTimeout(hintT); hintT = setTimeout(() => { hint.style.opacity = 0; }, 1100);
};

const map = L.map('map', {zoomControl:false, scrollWheelZoom:true, wheelPxPerZoomLevel:90}).setView(KL, 13);
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/', ATTR = 'Tiles &copy; Esri';
const roads = L.tileLayer(ESRI + 'World_Street_Map/MapServer/tile/{z}/{y}/{x}', {maxNativeZoom:19, maxZoom:20, attribution:ATTR, keepBuffer:4}).addTo(map);
let sat = null, isSat = false;
const satLayer = () => sat || (sat = L.layerGroup([
  L.tileLayer(ESRI + 'World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxNativeZoom:19, maxZoom:20, attribution:ATTR}),
  L.tileLayer(ESRI + 'Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', {maxNativeZoom:19, maxZoom:20, opacity:.85}),
  L.tileLayer(ESRI + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {maxNativeZoom:19, maxZoom:20})
]));
const THUMB = {sat:ESRI + 'World_Imagery/MapServer/tile/13/4024/6409', map:ESRI + 'World_Street_Map/MapServer/tile/13/4024/6409'};

const Ctl = L.Control.extend({onAdd() { const el = this.options.el; L.DomEvent.disableClickPropagation(el); L.DomEvent.disableScrollPropagation(el); return el; }});
const layerBtn = L.DomUtil.create('button', 'gp-layer'); layerBtn.type = 'button';
const paintLayerBtn = () => { const k = isSat ? 'map' : 'sat'; layerBtn.style.backgroundImage = `url(${THUMB[k]})`; layerBtn.innerHTML = `<span>${TX[k]}</span>`; layerBtn.setAttribute('aria-label', TX[k]); };
layerBtn.onclick = () => { isSat = !isSat; if (isSat) { satLayer().addTo(map); map.removeLayer(roads); } else { roads.addTo(map); map.removeLayer(sat); } paintLayerBtn(); };
paintLayerBtn();
new Ctl({position:'bottomleft', el:layerBtn}).addTo(map);
const recBtn = L.DomUtil.create('button', 'gp-btn'); recBtn.type = 'button'; recBtn.title = TX.recenter; recBtn.setAttribute('aria-label', TX.recenter);
recBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg>';
recBtn.onclick = () => { map.closePopup(); fit(true); };
new Ctl({position:'bottomright', el:recBtn}).addTo(map);
L.control.zoom({position:'bottomright', zoomInTitle:TX.zin, zoomOutTitle:TX.zout}).addTo(map);
map.attributionControl.setPrefix(false);

let S = null, focus = null, shown = null, openT = null, youM = null, youK = 'null';
const M = {};
const popup = it => `<div class="pp"><strong class="nm">${it.num} · ${esc(it.name)}</strong>
<div class="row">${IC.pin}<span class="g">${esc(it.addr)}</span></div>
<div class="row">${IC.clock}<span>${esc(it.hours)}</span><span class="open${it.open ? '' : ' off'}">${esc(it.openLabel)}</span></div>
<div class="row">${IC.bike}<span><b>${esc(it.deliveryLabel)}</b>${it.kmLabel ? ' · ' + esc(it.kmLabel) : ''}</span></div>
<div class="acts"><a href="${esc(it.dirHref)}" target="_blank" rel="noopener">${IC.nav}${esc(S.tx.dir)}</a><a href="${esc(it.waHref)}" target="_blank" rel="noopener">${IC.msg}${esc(S.tx.wa)}</a></div></div>`;
const openLater = (id, ms) => { clearTimeout(openT); openT = setTimeout(() => { const m = M[id]; if (m && map.hasLayer(m)) m.openPopup(); }, ms); };

function paint() {
  S.items.forEach(it => {
    let m = M[it.id];
    if (!m) {
      m = M[it.id] = L.marker(GEO[it.id], {title:it.name}).bindPopup('', {maxWidth:300, minWidth:260, autoPanPadding:[24, 24]});
      m.on('click', () => { focus = it.id; paint(); post({type:'gplink:focus', id:it.id}); });
    }
    const vis = S.visible.includes(it.id);
    if (vis && !map.hasLayer(m)) m.addTo(map);
    if (!vis && map.hasLayer(m)) map.removeLayer(m);
    const on = it.id === focus, cur = it.id === S.cur, k = it.num + (on ? 'o' : '') + (cur ? 'c' : '');
    if (m._k !== k) {
      const s = on ? 38 : 30, tip = Math.round(s * 1.207);
      m.setIcon(L.divIcon({className:'', html:`<div class="gp-pw"><div class="gp-pin${cur ? ' cur' : ''}${on ? ' on' : ''}"><b>${it.num}</b></div></div>`, iconSize:[s, s], iconAnchor:[s / 2, tip], popupAnchor:[0, -tip - 4]}));
      m.setZIndexOffset(on ? 1000 : cur ? 600 : 0);
      m._k = k;
    }
    m.setPopupContent(popup(it));
    if (m.isPopupOpen()) m.getPopup().update();
  });
}
function fit(animate) {
  const pts = (S ? S.visible : Object.keys(GEO)).map(id => GEO[id]).filter(Boolean);
  if (S && S.you) pts.push(S.you);
  if (!pts.length) { map.setView(KL, 13, {animate:!!animate}); return; }
  map.fitBounds(L.latLngBounds(pts), {padding:[56, 56], maxZoom:15, animate:!!animate});
}
function fly(id) {
  const m = M[id]; if (!m || !map.hasLayer(m)) return;
  focus = id; paint(); map.closePopup();
  const z = Math.max(map.getZoom(), 16);
  map.flyTo(map.unproject(map.project(GEO[id], z).subtract([0, 110]), z), z, {duration:.6});
  openLater(id, 680);
}
fit(false);
addEventListener('message', e => {
  const d = e.data; if (!d || typeof d !== 'object') return;
  if (d.type === 'gplink:state') {
    const first = !S, vis = (d.visible || []).join(','), yk = JSON.stringify(d.you || null), moved = yk !== youK;
    S = d; focus = d.focus;
    if (moved) { youK = yk; if (youM) { map.removeLayer(youM); youM = null; } if (d.you) youM = L.marker(d.you, {icon:L.divIcon({className:'', html:'<div class="gp-you"></div>', iconSize:[16, 16], iconAnchor:[8, 8]}), interactive:false, zIndexOffset:500}).addTo(map); }
    paint();
    if (first || moved || vis !== shown) { shown = vis; map.closePopup(); fit(!first); if (focus) openLater(focus, first ? 350 : 300); }
  } else if (d.type === 'gplink:fly' && S) fly(d.id);
});
post({type:'gplink:ready'});
</script>
</body>
</html>
